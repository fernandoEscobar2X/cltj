<!doctype html>
<html lang="es-MX">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>TJ Láser | Publicidad y regalos a medida en Tijuana</title>
    <meta
      name="description"
      content="Taller en Tijuana de publicidad, regalos y piezas a medida. Cotiza por WhatsApp y recibe precio en menos de 24h."
    />
    <meta name="theme-color" content="#F5F5F7" />
    <!-- Los crawlers de WhatsApp, Facebook y X no ejecutan JavaScript: estas
         etiquetas deben vivir en el HTML estatico, no solo en react-helmet.
         El canonical NO se pone aqui: seria el mismo para todas las rutas y
         mandaria /galeria hacia /. Lo emite react-helmet por ruta, y quien no
         ejecute JS asume canonical propio, que es el comportamiento correcto. -->
    <meta property="og:type" content="website" />
    <meta property="og:locale" content="es_MX" />
    <meta property="og:site_name" content="TJ Láser" />
    <meta
      property="og:title"
      content="TJ Láser | Publicidad y regalos a medida en Tijuana"
    />
    <meta
      property="og:description"
      content="Taller en Tijuana de publicidad, regalos y piezas a medida. Cotiza por WhatsApp y recibe precio en menos de 24h."
    />
    <meta property="og:url" content="https://tjlaser.com.mx/" />
    <meta
      property="og:image"
      content="https://tjlaser.com.mx/branding/og-cover.png"
    />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta
      property="og:image:alt"
      content="TJ Láser | Publicidad y regalos a medida en Tijuana"
    />
    <meta name="twitter:card" content="summary_large_image" />
    <meta
      name="twitter:title"
      content="TJ Láser | Publicidad y regalos a medida en Tijuana"
    />
    <meta
      name="twitter:description"
      content="Taller en Tijuana de publicidad, regalos y piezas a medida. Cotiza por WhatsApp y recibe precio en menos de 24h."
    />
    <meta
      name="twitter:image"
      content="https://tjlaser.com.mx/branding/og-cover.png"
    />

    <link rel="icon" href="/branding/favicon.svg" type="image/svg+xml" />
    <link
      rel="preload"
      as="image"
      href="/img-featured/display-shulas.webp"
      fetchpriority="high"
    />

    <!-- Bricolage se carga desde @fontsource-variable en main.jsx. -->
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
